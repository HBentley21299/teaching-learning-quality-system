name: Deploy development

on:
  workflow_run:
    workflows:
      - TLQS CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: tlqs-development
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy verified package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: development
      url: ${{ vars.DEVELOPMENT_URL }}
    env:
      VITE_API_BASE_URL: ""
      VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
      VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Validate deployment scope and configuration
        shell: pwsh
        run: |
          $required = @{
            AZURE_CLIENT_ID = '${{ vars.AZURE_CLIENT_ID }}'
            AZURE_TENANT_ID = '${{ vars.AZURE_TENANT_ID }}'
            AZURE_SUBSCRIPTION_ID = '${{ vars.AZURE_SUBSCRIPTION_ID }}'
            AZURE_RESOURCE_GROUP = '${{ vars.AZURE_RESOURCE_GROUP }}'
            AZURE_APP_SERVICE_NAME = '${{ vars.AZURE_APP_SERVICE_NAME }}'
            DEVELOPMENT_URL = '${{ vars.DEVELOPMENT_URL }}'
            ENTRA_SPA_CLIENT_ID = '${{ vars.ENTRA_SPA_CLIENT_ID }}'
            ENTRA_API_SCOPE = '${{ vars.ENTRA_API_SCOPE }}'
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) { throw "Missing development environment variables: $($missing -join ', ')" }

          $expectedCommit = '${{ github.event.workflow_run.head_sha }}'
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "Checked out $actualCommit instead of the verified commit $expectedCommit."
          }

          git diff --quiet HEAD^1 HEAD -- database infra/azure
          if ($LASTEXITCODE -eq 1) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Manual deployment required'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'This release changes database or Azure infrastructure files. Run the guarded Azure deployment process before deploying the application package.'
            throw 'Automatic development deployment is blocked for database or infrastructure changes.'
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the verified commit; git diff exited with $LASTEXITCODE." }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify development release
        shell: pwsh
        run: .\scripts\verify-v1.ps1
      - name: Create portable deployment package
        shell: pwsh
        run: >-
          .\scripts\new-deployment-package.ps1
          -SourceDirectory .artifacts/v1/api
          -DestinationPath .artifacts/v1/tlqs-v1.zip
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy App Service package
        shell: pwsh
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_APP_SERVICE_NAME }}"
          --src-path .artifacts/v1/tlqs-v1.zip
          --type zip
          --clean true
          --restart true
          --output none
      - name: Verify development health
        shell: pwsh
        run: |
          $url = "${{ vars.DEVELOPMENT_URL }}".TrimEnd('/')
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $health = Invoke-RestMethod -Uri "$url/health/ready" -TimeoutSec 10
              if ($health.status -eq 'healthy' -and $health.database -eq 'connected') { exit 0 }
            } catch { Start-Sleep -Seconds 5 }
          } while ((Get-Date) -lt $deadline)
          throw "Development did not become healthy after deployment."
