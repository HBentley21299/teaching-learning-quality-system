name: TLQS CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tlqs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore apps/api/TLQS.sln --source https://api.nuget.org/v3/index.json
      - name: Validate deployment scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/apply-database.ps1',
            'scripts/deploy-azure.ps1',
            'scripts/deploy-on-premises.ps1',
            'scripts/grant-on-premises-database-access.ps1',
            'scripts/new-azure-release.ps1',
            'scripts/new-deployment-package.ps1',
            'scripts/new-on-premises-release.ps1',
            'scripts/rollback-on-premises.ps1',
            'scripts/set-bootstrap-admin.ps1',
            'scripts/verify-v1.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell parse errors: $($errors -join '; ')" }
          }
      - name: Compile Azure infrastructure
        shell: pwsh
        run: az bicep build --file infrastructure/azure/subscription.bicep --outfile "${{ runner.temp }}/subscription.json"
      - name: Audit dependencies
        run: dotnet list apps/api/TLQS.sln package --vulnerable --include-transitive --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build apps/api/TLQS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test apps/api/TLQS.sln --configuration Release --no-build
      - name: Publish Linux App Service package
        run: dotnet publish apps/api/src/TLQS.Api/TLQS.Api.csproj --configuration Release --runtime linux-x64 --self-contained false --output artifacts/api
      - uses: actions/upload-artifact@v6
        with:
          name: tlqs-api-linux-x64
          path: artifacts/api
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: apps/web
        run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: tlqs-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
