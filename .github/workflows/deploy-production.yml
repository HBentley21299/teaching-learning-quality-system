name: Deploy production

on:
  workflow_dispatch:
    inputs:
      database_ready:
        description: Production database migrations for this release have been applied
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tlqs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified package
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    env:
      VITE_API_BASE_URL: ""
      VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
      VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment gate and configuration
        shell: pwsh
        run: |
          if ('${{ inputs.database_ready }}' -ne 'true') {
            throw 'Database readiness must be confirmed before production deployment.'
          }
          $required = @{
            AZURE_CLIENT_ID = '${{ vars.AZURE_CLIENT_ID }}'
            AZURE_TENANT_ID = '${{ vars.AZURE_TENANT_ID }}'
            AZURE_SUBSCRIPTION_ID = '${{ vars.AZURE_SUBSCRIPTION_ID }}'
            AZURE_RESOURCE_GROUP = '${{ vars.AZURE_RESOURCE_GROUP }}'
            AZURE_APP_SERVICE_NAME = '${{ vars.AZURE_APP_SERVICE_NAME }}'
            PRODUCTION_URL = '${{ vars.PRODUCTION_URL }}'
            ENTRA_SPA_CLIENT_ID = '${{ vars.ENTRA_SPA_CLIENT_ID }}'
            ENTRA_API_SCOPE = '${{ vars.ENTRA_API_SCOPE }}'
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) { throw "Missing production environment variables: $($missing -join ', ')" }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify release
        shell: pwsh
        run: .\scripts\verify-v1.ps1
      - name: Create deployment package
        shell: pwsh
        run: Compress-Archive -Path .artifacts/v1/api/* -DestinationPath .artifacts/v1/tlqs-v1.zip -CompressionLevel Optimal
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy App Service package
        shell: pwsh
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_APP_SERVICE_NAME }}"
          --src-path .artifacts/v1/tlqs-v1.zip
          --type zip
          --clean true
          --restart true
          --output none
      - name: Verify production health
        shell: pwsh
        run: |
          $url = "${{ vars.PRODUCTION_URL }}".TrimEnd('/')
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $health = Invoke-RestMethod -Uri "$url/health/ready" -TimeoutSec 10
              if ($health.status -eq 'healthy' -and $health.database -eq 'connected') { exit 0 }
            } catch { Start-Sleep -Seconds 5 }
          } while ((Get-Date) -lt $deadline)
          throw "Production did not become healthy after deployment."
